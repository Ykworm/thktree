<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>ThkTree Figma Node Importer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      margin: 0;
      padding: 12px;
      font-size: 12px;
      color: #222;
      background: #fff;
    }
    h3 { margin: 0 0 6px 0; font-size: 13px; }
    .hint { color: #888; margin-bottom: 8px; line-height: 1.5; }
    textarea {
      width: 100%;
      height: 380px;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      padding: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #18a0fb; }
    .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    button {
      padding: 8px 16px;
      border: 1px solid transparent;
      background: #18a0fb;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    button:hover { filter: brightness(1.05); }
    button.secondary { background: #fff; color: #333; border-color: #d0d0d0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status {
      flex: 1;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      display: none;
    }
    #status.success { background: #e8f5e9; color: #2e7d32; display: block; }
    #status.error   { background: #ffebee; color: #c62828; display: block; }
    #status.info    { background: #e3f2fd; color: #1565c0; display: block; }
  </style>
</head>
<body>
  <h3>ThkTree Figma Node Importer</h3>
  <div class="hint">粘贴 Figma Node Export JSON（DOCUMENT → CANVAS → ...），然后点击 Import 即可在当前文件中生成可编辑图层。</div>

  <textarea id="json" placeholder='{"document": {"type":"DOCUMENT", "children":[...]}}'></textarea>

  <div class="row">
    <button id="import">Import</button>
    <button id="cancel" class="secondary">Cancel</button>
    <div id="status"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function setStatus(msg, kind) {
      const el = $('status');
      el.textContent = msg || '';
      el.className = msg ? (kind || 'info') : '';
    }

    $('import').onclick = () => {
      const json = $('json').value;
      if (!json.trim()) {
        setStatus('请粘贴 JSON 后再点击 Import', 'error');
        return;
      }
      setStatus('导入中…', 'info');
      $('import').disabled = true;
      parent.postMessage({ pluginMessage: { type: 'import', json } }, '*');
    };

    $('cancel').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      $('import').disabled = false;
      if (msg.type === 'success') setStatus(msg.message || '导入成功', 'success');
      else if (msg.type === 'error') setStatus(msg.message || '导入失败', 'error');
      else if (msg.type === 'info') setStatus(msg.message || '', 'info');
    };
  </script>
</body>
</html>
