    value: "#6366F180"
    dartRef: "AppColors.questionSourceTag"
    usage: "我问过的问题 → 来源标签背景（accent 50% 透明）"

# ============================================================
# 2. 主题色 — 5 套典雅黑金色调
# ============================================================

themeColors:
  description: "5 套主题色，按 themeId.hashCode.abs() % 5 稳定分配"
  helperMethods:
    colorForTheme:
      dartRef: "AppColors.colorForTheme(themeId)"
      usage: "根据 themeId 返回主题色"
    tintForTheme:
      dartRef: "AppColors.tintForTheme(themeId)"
      usage: "主题色的 15% tint，用于 leading icon 背景"
  palette:
    - name: champagneGold
      value: "#C4A77D"
      dartRef: "AppColors.champagneGold"
      hsl: "HSL(36, 33%, 63%)"
      index: 0
    - name: warmGray
      value: "#8E8B82"
      dartRef: "AppColors.warmGray"
      hsl: "HSL(42, 4%, 53%)"
      index: 1
    - name: dustyRose
      value: "#A89090"
      dartRef: "AppColors.dustyRose"
      hsl: "HSL(0, 10%, 61%)"
      index: 2
    - name: sageGray
      value: "#8B9080"
      dartRef: "AppColors.sageGray"
      hsl: "HSL(80, 7%, 53%)"
      index: 3
    - name: slateBlue
      value: "#6B7B8E"
      dartRef: "AppColors.slateBlue"
      hsl: "HSL(210, 14%, 49%)"
      index: 4

# ============================================================
# 3. 节点色 — 5 套 NodePalette（AppColors 内公开类）
# ============================================================

nodePalettes:
  description: "节点卡片配色，基于 nodeId.hashCode.abs() % 5，与主题色完全解耦"
  dartRef: "NodePalette (app_colors.dart 公开类)"
  helperMethod:
    dartRef: "AppColors.paletteForNode(nodeId)"
  palette:
    - index: 0
      circle: "#B8A07A"
      title: "#4A4A4A"
      subtitle: "#8B7355"
      style: "暖金"
    - index: 1
      circle: "#7A8B7A"
      title: "#3D4A3D"
      subtitle: "#6B7B6B"
      style: "灰绿"
    - index: 2
      circle: "#8B7A8B"
      title: "#4A3D4A"
      subtitle: "#7B6B7B"
      style: "灰紫"
    - index: 3
      circle: "#8B7A7A"
      title: "#4A3D3D"
      subtitle: "#7B6B6B"
      style: "灰粉"
    - index: 4
      circle: "#7A7A8B"
      title: "#3D3D4A"
      subtitle: "#6B6B7B"
      style: "灰蓝"

