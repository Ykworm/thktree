  accent:
    value: "#6366F1"
    dartRef: "AppColors.accent"
    usage: "通用交互色，按钮/链接/focus"
  accentLight:
    value: "#EEF2FF"
    dartRef: "AppColors.accentLight"
    usage: "accent 10% tint，hover 背景、chip 背景"
  accentDeep:
    value: "#4F46E5"
    dartRef: "AppColors.accentDeep"
    usage: "pressed 态"

  # ── Surface 层 ──
  pageBg:
    value: "#F8FAFC"
    dartRef: "AppColors.pageBg"
    usage: "Slate 50，页面底色"
  surface:
    value: "#FFFFFF"
    dartRef: "AppColors.surface"
    usage: "纯白，卡片/弹层"
  surfaceMuted:
    value: "#F1F5F9"
    dartRef: "AppColors.surfaceMuted"
    usage: "Slate 100，二级区块"

  # ── 文字色 ──
  textPrimary:
    value: "#1E293B"
    dartRef: "AppColors.textPrimary"
    usage: "Slate 900，标题/正文"
  textSecondary:
    value: "#64748B"
    dartRef: "AppColors.textSecondary"
    usage: "Slate 500，辅助信息"
  textTertiary:
    value: "#94A3B8"
    dartRef: "AppColors.textTertiary"
    usage: "Slate 400，placeholder/disabled"

  # ── 结构色 ──
  border:
    value: "#E2E8F0"
    dartRef: "AppColors.border"
    usage: "Slate 200，分隔线/卡片描边"
  destructive:
    value: "#DC2626"
    dartRef: "AppColors.destructive"
    usage: "危险操作（删除按钮）"
  success:
    value: "#34C759"
    dartRef: "AppColors.success"
    usage: "成功状态（对应 systemGreen）"
  onSurface:
    value: "#FFFFFF"
    dartRef: "AppColors.onSurface"
    usage: "卡片上前景色（白色）"

  # ── Chat / Sheet 语义色 (§8 新增) ──
  scrim:
    value: "#00000080"
    dartRef: "AppColors.scrim"
    usage: "Bottom Sheet 遮罩（50% 透明黑）— 源码 Color(0x80000000)"
