# ============================================================
# 6. 动画 — 文档定义
# ============================================================

animation:
  circleToggle:
    duration: 200
    curve: "easeInOut"
    dartRef: "AppDur.sheetScroll"
    usage: "圆圈展开/折叠"
  dragHandleScale:
    duration: 120
    curve: "easeOut"
    dartRef: "AppDur.scrimFade"
    usage: "拖拽手柄 scale"
  listRefresh:
    duration: 200
    curve: "easeInOut"
    dartRef: "AppDur.copyFeedback"
    usage: "列表刷新"
  modal:
    duration: 250
    curve: "easeOut"
    dartRef: "AppDur.modal"
    usage: "弹层出现"

  # ── Chat 动效 (§8 新增) ──
  copyFeedback:
    duration: 2000
    curve: null
    dartRef: "AppDur.copyFeedback"
    usage: "复制成功 icon 变色持续时间（2s）"
  sheetScroll:
    duration: 300
    curve: "easeOut"
    dartRef: "AppDur.listScroll"
    usage: "Sheet 内列表滚动过渡"
  streamingIndicator:
    duration: 1500
    curve: "easeInOut"
    dartRef: "AppDur.shimmer"
    usage: "生成中指示器脉动"

