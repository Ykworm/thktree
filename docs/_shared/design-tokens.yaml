    value: "#F1F5F9"
    dartRef: "AppColors.thinkingBg"
    usage: "思考过程背景 — getter 指向 surfaceMuted，语义别名"
  markdownCodeBg:
    value: "#F8FAFC"
    dartRef: "AppColors.markdownCodeBg"
    usage: "Markdown 代码块背景 — getter 指向 pageBg，语义别名"
  userBubbleBg:
    value: "#EEF2FF"
    dartRef: "AppColors.userBubbleBg"
    usage: "用户消息气泡背景 — getter 指向 accentLight，语义别名"
  assistantBubbleBg:
    value: "#FFFFFF"
    dartRef: "AppColors.assistantBubbleBg"
    usage: "助手消息气泡背景 — getter 指向 surface"
  assistantBubbleBorder:
    value: "#E2E8F0"
    dartRef: "AppColors.assistantBubbleBorder"
    usage: "助手消息气泡 0.5px 边框 — getter 指向 border"
  copyFeedbackSuccess:
    value: "#34C759"
    dartRef: "AppColors.success"
    usage: "复制成功 2s icon 变色"
