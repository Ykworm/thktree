  # 主题详情
  - key: "treeTitle(themeTitle)"
    usage: "详情 NavBar 标题"
  - key: "emptyTree"
    usage: "树空状态文案"
  - key: "renameNode"
    usage: "重命名对话框标题"
  - key: "enterNewTitle"
    usage: "重命名 placeholder"
  - key: "newSession"
