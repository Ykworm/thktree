<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="section-features-title">
  <title id="section-features-title">功能特性</title>
  
  <rect width="1200" height="120" rx="16" fill="#F8F9FA"/>
  
  <g transform="translate(80 40)">
    <!-- 图标 -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#2E7D32" opacity="0.1"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" fill="#2E7D32" text-anchor="middle">🌳</text>
    
    <!-- 标题 -->
    <text x="60" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="32" fill="#1A1A1A" font-weight="700">功能特性</text>
    
    <!-- 装饰线 -->
    <line x1="60" y1="45" x2="200" y2="45" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 右侧装饰 -->
  <g transform="translate(1100 40)">
    <circle cx="20" cy="20" r="8" fill="#2E7D32" opacity="0.2"/>
    <circle cx="40" cy="20" r="8" fill="#2E7D32" opacity="0.15"/>
    <circle cx="60" cy="20" r="8" fill="#2E7D32" opacity="0.1"/>
  </g>
</svg>