<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">ThkTree - 让思考，长成一棵树</title>
  <desc id="desc">展示知识树概念的视觉元素，包括树形结构、分支和节点</desc>

  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F5E8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="400" rx="26" fill="url(#bgGradient)"/>

  <!-- 左侧：标题和描述 -->
  <g id="title-block" transform="translate(80 60)">
    <!-- 分类 -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="18" fill="#666666" font-weight="500">iOS 优先的 AI 知识树 App</text>
    
    <!-- 项目名称 -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="72" fill="#1A1A1A" font-weight="700">ThkTree</text>
    
    <!-- 标语 -->
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="36" fill="#2E7D32" font-weight="600">让思考，长成一棵树</text>
    
    <!-- 描述 -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" fill="#555555">把 LLM 对话组织成可嵌套、可检索、本地生长的树</text>
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" fill="#555555">隐私优先、模型自选</text>
    
    <!-- 元数据 -->
    <g transform="translate(0 260)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#2E7D32" opacity="0.1"/>
      <text x="60" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="500">Flutter</text>
      
      <rect x="140" y="0" width="120" height="32" rx="16" fill="#2E7D32" opacity="0.1"/>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="500">iOS</text>
      
      <rect x="280" y="0" width="120" height="32" rx="16" fill="#2E7D32" opacity="0.1"/>
      <text x="340" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="500">AI</text>
    </g>
  </g>

  <!-- 右侧：知识树视觉元素 -->
  <g id="tree-visual" transform="translate(700 40)">
    <!-- 主树干 -->
    <path d="M200 350 L200 200" stroke="#795548" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- 主分支 -->
    <path d="M200 200 L150 150" stroke="#795548" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M200 200 L250 150" stroke="#795548" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M200 200 L200 120" stroke="#795548" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- 次分支 -->
    <path d="M150 150 L120 100" stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M150 150 L180 100" stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M250 150 L220 100" stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M250 150 L280 100" stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- 叶子节点 -->
    <circle cx="120" cy="100" r="12" fill="#4CAF50"/>
    <circle cx="180" cy="100" r="12" fill="#4CAF50"/>
    <circle cx="220" cy="100" r="12" fill="#4CAF50"/>
    <circle cx="280" cy="100" r="12" fill="#4CAF50"/>
    <circle cx="200" cy="120" r="12" fill="#4CAF50"/>
    
    <!-- 节点标签 -->
    <text x="120" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" fill="#333333" text-anchor="middle">对话</text>
    <text x="180" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" fill="#333333" text-anchor="middle">笔记</text>
    <text x="220" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" fill="#333333" text-anchor="middle">搜索</text>
    <text x="280" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" fill="#333333" text-anchor="middle">Lab</text>
    <text x="200" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" fill="#333333" text-anchor="middle">主题</text>
    
    <!-- 连接线 -->
    <path d="M120 100 L180 100" stroke="#9E9E9E" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <path d="M180 100 L220 100" stroke="#9E9E9E" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <path d="M220 100 L280 100" stroke="#9E9E9E" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    
    <!-- 根系 -->
    <path d="M200 350 L180 380" stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M200 350 L220 380" stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M200 350 L200 390" stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 底部装饰 -->
  <g transform="translate(0 350)">
    <rect x="0" y="0" width="1200" height="50" fill="#2E7D32" opacity="0.05"/>
    <text x="600" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" fill="#666666" text-anchor="middle">隐私优先 · 模型自选 · 本地生长</text>
  </g>
</svg>