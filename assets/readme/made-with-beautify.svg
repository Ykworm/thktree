<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="64" viewBox="0 0 420 64"
     role="img" aria-labelledby="made-with-title">
  <title id="made-with-title">README made with beautify-github-readme</title>
  
  <rect width="420" height="64" rx="32" fill="#F8F9FA"/>
  <rect x="2" y="2" width="416" height="60" rx="30" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  
  <g transform="translate(20 16)">
    <!-- 图标 -->
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#2E7D32" opacity="0.1"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="18" fill="#2E7D32" text-anchor="middle">✨</text>
    
    <!-- 文字 -->
    <text x="44" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" fill="#666666" font-weight="500">README MADE WITH</text>
    <text x="44" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" fill="#1A1A1A" font-weight="700">beautify-github-readme</text>
  </g>
  
  <!-- 箭头 -->
  <g transform="translate(380 24)">
    <path d="M0 8 L16 8 L12 0 M16 8 L12 16" stroke="#2E7D32" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>