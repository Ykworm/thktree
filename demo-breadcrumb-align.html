<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>面包屑对齐修复对比 Demo</title>
<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --border: #d1d1d6;
    --text-primary: #1c1c1e;
    --text-secondary: #8e8e93;
    --accent: #007aff;
    --phone-w: 390px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }
  .toolbar { margin: 0 0 24px; display: flex; gap: 8px; align-items: center; }
  .toolbar button {
    font-size: 13px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-primary);
  }
  .toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: flex; gap: 24px; flex-wrap: wrap; }
  .phone {
    width: var(--phone-w); background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .phone .tag {
    font-size: 11px; font-weight: 600; padding: 6px 12px; letter-spacing: .3px;
    border-bottom: 1px solid var(--border);
  }
  .tag.before { color: #c0392b; background: #fdedec; }
  .tag.after  { color: #1e8449; background: #eafaf1; }

  /* 模拟 navBar：middle 居中（预期行为，不在本次改动范围） */
  .navbar {
    display: flex; align-items: center; justify-content: center; position: relative;
    height: 44px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600;
  }
  .navbar .back { position: absolute; left: 8px; color: var(--accent); font-size: 22px; }

  /* 面包屑区：这是修复核心 */
  .breadcrumb-zone { padding: 0; border-bottom: 1px solid var(--border); }

  /* 旧：Column 默认 crossAxis=center 下，非 Expanded 的 Container 收缩到内容宽度并整体居中 */
  .crumb-old {
    display: inline-block;            /* 收缩到内容宽度 */
    margin: 0 auto;                   /* 整体居中 */
    padding: 8px 16px 4px;
    font-size: 12px; line-height: 1.5;
    text-align: left;                 /* 段内左对齐，但整块被居中 */
    max-width: 100%;
  }
  /* 新：占满宽度 + 强制左对齐 */
  .crumb-new {
    display: block; width: 100%;
    padding: 8px 16px 4px;
    font-size: 12px; line-height: 1.5;
    text-align: left;
  }
  .crumb { white-space: normal; }
  .seg { color: var(--text-secondary); }
  .seg.current { color: var(--text-primary); font-weight: 500; }
  .sep { color: var(--border); margin: 0 2px; }
  .seg .trunc {
    display: inline-block; max-width: 160px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
  }
  .messages {
    padding: 16px; color: var(--text-secondary); font-size: 13px; line-height: 1.6;
  }
  .hint { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
</style>
</head>
<body>
  <h1>面包屑对齐修复对比</h1>
  <p class="sub">左：修复前（Column 默认 center → 面包屑收缩+整块居中，浪费右侧空间） ｜ 右：修复后（占满宽度+左对齐）</p>

  <div class="toolbar">
    <span>标题长度：</span>
    <button id="btnShort" class="active" onclick="setMode('short')">短标题</button>
    <button id="btnLong" onclick="setMode('long')">长标题（触发换行）</button>
  </div>

  <div class="grid">
    <!-- 旧 -->
    <div class="phone">
      <div class="tag before">修复前 · 居中收缩</div>
      <div class="navbar"><span class="back">‹</span>当前对话标题</div>
      <div class="breadcrumb-zone">
        <div class="crumb-old crumb" id="old"></div>
      </div>
      <div class="messages">消息列表区域（Expanded，本来就占满，不受影响）</div>
    </div>

    <!-- 新 -->
    <div class="phone">
      <div class="tag after">修复后 · 占满左对齐</div>
      <div class="navbar"><span class="back">‹</span>当前对话标题</div>
      <div class="breadcrumb-zone">
        <div class="crumb-new crumb" id="new"></div>
      </div>
      <div class="messages">消息列表区域（Expanded，本来就占满，不受影响）</div>
    </div>
  </div>

  <p class="hint">提示：上方 navBar 的"当前对话标题"仍是居中（那是 navBar middle 的预期行为，不在本次改动范围内）。本次只修面包屑区块的对齐。</p>

<script>
  const shortData = [
    { t: "主题", cur: false },
    { t: "我的项目", cur: false },
    { t: "方案讨论", cur: false },
    { t: "第一轮对话", cur: true },
  ];
  const longData = [
    { t: "主题", cur: false },
    { t: "这是一个非常长的主题名称用于演示换行效果会占据较多空间", cur: false },
    { t: "父节点也是一个很长的标题用来测试面包屑在空间不足时的表现", cur: false },
    { t: "当前节点长标题同样的很长想要看左对齐和居中哪种更省空间", cur: true },
  ];

  function render(list) {
    const make = (arr) => arr.map((s, i) => {
      const isLast = i === arr.length - 1;
      const sep = i > 0 ? '<span class="sep">/</span>' : '';
      const cls = s.cur ? 'seg current' : 'seg';
      const label = s.cur
        ? `<span class="trunc">${s.t}</span>`
        : `<span class="trunc">${s.t}</span>`;
      return `${sep}<span class="${cls}">${label}</span>`;
    }).join('');
    document.getElementById('old').innerHTML = make(list);
    document.getElementById('new').innerHTML = make(list);
  }

  let mode = 'short';
  function setMode(m) {
    mode = m;
    document.getElementById('btnShort').classList.toggle('active', m === 'short');
    document.getElementById('btnLong').classList.toggle('active', m === 'long');
    render(m === 'short' ? shortData : longData);
  }
  setMode('short');
</script>
</body>
</html>
